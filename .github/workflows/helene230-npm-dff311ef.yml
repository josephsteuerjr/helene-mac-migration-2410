name: Helene native Mac npm preparation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Check helper and prepare exact locked native cache
        run: |
          python3 -m unittest discover -s qualifications/dff311ef -p test_npm_probe.py -q
          python3 qualifications/dff311ef/mac_npm_probe.py --inputs qualifications/dff311ef/npm-inputs --out npm230-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helene230-npm-${{ github.run_id }}-${{ github.run_attempt }}
          path: npm230-out
          retention-days: 7
          if-no-files-found: error
