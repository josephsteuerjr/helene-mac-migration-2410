name: Native Mac 2.2.10 update modes
on:
  workflow_dispatch:
    inputs:
      candidate_tag: {required: true, type: string}
      candidate_name: {required: true, type: string}
      candidate_sha256: {required: true, type: string}
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - name: Driver dependencies
        run: python3 -m pip install psutil pyobjc-framework-Quartz
      - name: Verified old and controlled candidate inputs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.candidate_tag }}
          NAME: ${{ inputs.candidate_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/inputs"
          gh release download v2.2.9 --repo josephsteuerjr/praxis --pattern Helene-2.2.9-macos-arm64.zip --dir "$RUNNER_TEMP/inputs"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir "$RUNNER_TEMP/inputs"
      - name: Native Cocoa preserve and clean update and rollback
        env:
          CANDIDATE_NAME: ${{ inputs.candidate_name }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha256 }}
        run: python3 qualification210.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-acceptance210-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/native210/*-evidence/
