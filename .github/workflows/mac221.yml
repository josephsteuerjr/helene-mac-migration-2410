name: Native setup 2.2.11
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - name: Driver dependencies
        run: python3 -m pip install psutil pyobjc-framework-Quartz
      - name: Download retained base and exact byte delta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/input211"
          gh release download qualification-210-r3-2710 --repo "$GITHUB_REPOSITORY" --pattern Helene-2.2.10-macos-arm64.zip --dir "$RUNNER_TEMP/input211"
          gh release download qualification-setup211-ef31-2810 --repo "$GITHUB_REPOSITORY" --pattern macos-delta.zip --dir "$RUNNER_TEMP/input211"
      - name: Reconstruct and verify final archive
        run: python3 assemble_mac_input.py --base "$RUNNER_TEMP/input211/Helene-2.2.10-macos-arm64.zip" --delta "$RUNNER_TEMP/input211/macos-delta.zip" --output "$RUNNER_TEMP/input211/Helene-2.2.11-macos-arm64.zip"
      - name: Real Cocoa first launch and fresh installation
        run: |
          SHA=$(python3 -c 'import json;print(json.load(open("macos-delta.json"))["sha256"])')
          python3 native_setup_smoke.py --archive "$RUNNER_TEMP/input211/Helene-2.2.11-macos-arm64.zip" --sha256 "$SHA" --work "$RUNNER_TEMP/work211" --evidence "$RUNNER_TEMP/evidence211"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-setup211-${{ github.sha }}
          path: ${{ runner.temp }}/evidence211
